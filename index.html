<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合理調整宣導共思平台</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#243749;background:#f4f8fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:36px auto;padding:0 18px}header{background:#dcecf6;border-radius:20px;padding:26px 30px;margin-bottom:20px}h1{font-size:clamp(23px,4vw,32px);margin:0 0 8px}header p{margin:0;line-height:1.7}.panel{background:white;border:1px solid #e1e9ef;border-radius:18px;padding:25px;margin-bottom:18px;box-shadow:0 3px 16px #25435a0a}h2{font-size:19px;margin:0 0 17px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{display:flex;gap:12px;align-items:center;border:2px solid #dce6ef;border-radius:14px;padding:20px 14px;cursor:pointer;background:white;font:inherit;font-weight:650;color:inherit;text-align:left}.choice .emoji{font-size:28px}.choice[aria-pressed=true]{border-color:#3680ae;background:#edf7ff}.choice:hover{border-color:#7baac9}textarea{width:100%;min-height:150px;padding:14px;border:1px solid #cbd8e4;border-radius:12px;font:inherit;resize:vertical;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button.action{background:#276f9b;color:white;border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:700;cursor:pointer}button.action:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:#e8f0f5;color:#275674}.muted{color:#647786;font-size:14px}.hidden{display:none!important}.status{min-height:24px;margin:12px 0 0}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}.stat{background:#f1f7fb;border-radius:12px;padding:15px}.stat strong{display:block;font-size:24px}.barrow{margin:16px 0}.barhead{display:flex;justify-content:space-between;gap:8px;font-size:14px}.track{height:12px;border-radius:20px;background:#e8eef2;overflow:hidden;margin-top:7px}.fill{height:100%;border-radius:20px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.filter{padding:8px 13px;border-radius:24px;border:1px solid #cddce8;background:white;cursor:pointer;font:inherit}.filter.active{background:#276f9b;color:white;border-color:#276f9b}.answer{border:1px solid #e2eaf0;border-radius:12px;padding:15px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.tag{font-size:13px;font-weight:700;color:#276f9b;margin-bottom:6px}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.note{font-size:13px;color:#627688}footer{text-align:center;color:#728594;font-size:13px;margin:24px 0}@media(max-width:550px){.wrap{margin:14px auto}.panel{padding:18px}.choice{padding:16px 10px}.choice .emoji{font-size:22px}.stats{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><header><h1>合理調整宣導討論平台</h1><p>如果要向學校人員宣導合理調整，你認為什麼最重要？</p></header>
<section id="formView"><div class="panel"><h2>1. 請選擇你認為最重要的宣導主題（單選）</h2><div class="choices" id="choices"></div></div><div class="panel"><h2 id="question">2. 在你選擇的主題下，應該向學校人員說明哪些內容？</h2><textarea id="content" maxlength="800" placeholder="請根據實務經驗，提出具體的宣導重點……"></textarea><p class="note">最多 800 字。回應將匿名公開在結果頁，請勿填寫學生或其他人的個人資料。</p><div class="actions"><button class="action" id="submit">送出回答</button><button class="action secondary" id="viewResults">查看大家的想法</button></div><p class="status muted" id="formStatus" role="status"></p></div></section>
<section id="resultView" class="hidden"><div class="panel"><div class="topline"><h2>全體票選結果</h2><button class="action secondary" id="back">返回填答</button></div><div class="stats"><div class="stat"><span class="muted">有效回應數</span><strong id="total">—</strong></div><div class="stat"><span class="muted">最多人選擇</span><strong id="leader" style="font-size:18px">—</strong></div></div><div id="bars"></div><p class="note">結果每 15 秒自動更新。</p></div><div class="panel"><h2>大家提出的宣導內容</h2><div id="filters" class="filters"></div><p id="resultStatus" class="muted" role="status"></p><div id="answers"></div></div></section><footer>合理調整宣導共思平台 · 匿名參與、共同交流</footer></main>
<script>
// 將下方網址改為部署後的 Google Apps Script Web App /exec 網址。
const API_URL = 'https://script.google.com/macros/s/AKfycbyFz3hUH4yGHPvxtYW0kdzNfPLFuzGpyAjunbxZqxzUpObXZGzVEePR6EenEtkrsT1DbQ/exec';
const topics=['理論','流程','案例','申訴'];const icons=['⚖️','🔄','📖','💬'];const colors=['#77b5d4','#86b995','#e7a987','#c3a4d5'];let selected='',filter='全部',cache=[],refreshTimer=null,requestInFlight=false;
const $=id=>document.getElementById(id);
function configured(){return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL)}
function jsonp(params){return new Promise((resolve,reject)=>{if(!configured())return reject(Error('請先在 index.html 設定 Apps Script 網址。'));const cb='ra_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);const script=document.createElement('script');const timeout=setTimeout(()=>finish(Error('連線逾時，請重試。')),12000);function finish(err,data){clearTimeout(timeout);delete window[cb];script.remove();err?reject(err):resolve(data)}window[cb]=data=>finish(null,data);script.onerror=()=>finish(Error('無法連接後台，請檢查網址及部署權限。'));script.src=API_URL+'?'+new URLSearchParams({...params,callback:cb,nonce:Date.now()}).toString();document.head.appendChild(script)})}
function renderChoices(){$('choices').replaceChildren();topics.forEach((t,i)=>{const b=document.createElement('button');b.className='choice';b.type='button';b.setAttribute('aria-pressed',String(selected===t));const e=document.createElement('span');e.className='emoji';e.textContent=icons[i];const name=document.createElement('span');name.textContent='合理調整的'+t;b.append(e,name);b.onclick=()=>{selected=t;renderChoices();$('question').textContent='2. 在「合理調整的'+t+'」這個主題下，你認為應該向學校人員說明哪些內容？'};$('choices').append(b)})}
function showResults(){location.hash='results'}function navigate(){const isResults=location.hash==='#results';$('formView').classList.toggle('hidden',isResults);$('resultView').classList.toggle('hidden',!isResults);clearInterval(refreshTimer);if(isResults){loadResults();refreshTimer=setInterval(loadResults,15000)}}
$('submit').onclick=async()=>{const content=$('content').value.trim();if(!selected){$('formStatus').textContent='請先選擇一個主題。';return}if(!content){$('formStatus').textContent='請填寫宣導內容。';return}if(content.length>800){$('formStatus').textContent='回答請勿超過 800 字。';return}if(sessionStorage.getItem('ra_submitted')){ $('formStatus').textContent='這個分頁已經提交過。請前往結果頁觀看。';return}const btn=$('submit');btn.disabled=true;$('formStatus').textContent='正在提交，請稍候……';try{const res=await jsonp({action:'submit',topic:selected,content});if(!res.ok)throw Error(res.error||'提交失敗');sessionStorage.setItem('ra_submitted','1');$('formStatus').textContent='提交成功！';showResults()}catch(e){$('formStatus').textContent=e.message}finally{btn.disabled=false}};
$('viewResults').onclick=showResults;$('back').onclick=()=>location.hash='form';window.addEventListener('hashchange',navigate);
function renderFilters(){const el=$('filters');el.replaceChildren();['全部',...topics].forEach(t=>{const b=document.createElement('button');b.className='filter'+(filter===t?' active':'');b.textContent=t==='全部'?'全部主題':'合理調整的'+t;b.onclick=()=>{filter=t;renderFilters();renderAnswers()};el.append(b)})}
function renderAnswers(){const el=$('answers');el.replaceChildren();const rows=cache.filter(r=>filter==='全部'||r.topic===filter);$('resultStatus').textContent=rows.length+' 筆回應';if(!rows.length){const p=document.createElement('p');p.className='muted';p.textContent='目前尚無回應。';el.append(p)}rows.forEach(r=>{const card=document.createElement('div');card.className='answer';const tag=document.createElement('div');tag.className='tag';tag.textContent='合理調整的'+r.topic;const body=document.createElement('div');body.textContent=r.content;card.append(tag,body);el.append(card)})}
async function loadResults(){if(requestInFlight)return;requestInFlight=true;try{const res=await jsonp({action:'results'});if(!res.ok)throw Error(res.error||'讀取失敗');cache=Array.isArray(res.rows)?res.rows:[];const counts=topics.map(t=>cache.filter(r=>r.topic===t).length),total=cache.length;$('total').textContent=total;const max=Math.max(...counts);$('leader').textContent=total?('合理調整的'+topics[counts.indexOf(max)]):'尚無資料';const bars=$('bars');bars.replaceChildren();topics.forEach((t,i)=>{const wrap=document.createElement('div');wrap.className='barrow';const top=document.createElement('div');top.className='barhead';const left=document.createElement('span');left.textContent='合理調整的'+t;const right=document.createElement('span');right.textContent=counts[i]+' 人（'+(total?Math.round(counts[i]/total*100):0)+'%）';top.append(left,right);const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.background=colors[i];fill.style.width=(total?counts[i]/total*100:0)+'%';track.append(fill);wrap.append(top,track);bars.append(wrap)});renderFilters();renderAnswers()}catch(e){$('resultStatus').textContent=e.message}finally{requestInFlight=false}}
renderChoices();navigate();
</script></body></html>
