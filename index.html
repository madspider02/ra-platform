<body>
<main class="wrap">
  <header class="hero"><div class="eyebrow">合理調整 · 現職教師工作坊</div><h1>合理調整宣導討論平台</h1><p>從宣導重點、學校運作、案例推演到常見問題，分成四個區塊一起思考如何落實合理調整。</p></header>
  <section id="welcome" class="welcome hidden"></section>
  <section id="app" class="hidden">
    <div class="identity"><div><strong id="userName"></strong> <span class="id-help"> · 可分次回來完成四個區塊</span></div><div class="actions"><button class="action outline small" id="showCode">查看返回代碼</button><button class="action outline small" id="switchUser">切換參與者</button></div></div>
    <div class="layout">
      <nav id="nav" class="nav" aria-label="四個討論區塊"></nav>
      <div class="workspace">
        <section id="workArea" class="panel"></section>
        <section id="resultArea" class="panel hidden"></section>
      </div>
    </div>
  </section>
  <footer class="footer">合理調整宣導共思平台 · 共同交流 · 製作者：國教院黃彥融副研究員<br>開放式討論用，請勿填寫學生姓名、醫療資訊或可辨識個案的細節。</footer>
</main>

const STAGES=[{id:'1',title:'提起申請釐清狀況',hint:'受理窗口、學生聲音、障礙處境、資料佐證與個案需求。'},{id:'2',title:'對話討論確認措施',hint:'相關性、可行性、比例性，以及跨處室協作和替代方案。'},{id:'3',title:'執行調整追蹤檢討',hint:'分工執行、追蹤成效、修正調整及爭議處理。'}];
const CASES=[
 {id:'azhe',title:'案例一｜阿哲的復學與校園參與',subtitle:'嚴重骨折與暫時性行動障礙',page:'參考指引案例 4（印刷頁 13–14）',story:'阿哲在暑假搭乘家人所騎的摩托車出遊時發生嚴重車禍，造成骨盆骨折，經手術以鋼板、螺絲固定。醫師評估至少需要半年以上復原，期間須使用輪椅，並避免久站或上下樓梯。開學後，家長向學校提出合理調整申請，希望學校在阿哲復健期間，針對課程學習、活動參與及校園行動提供支持，兼顧安全與復學適應。',guide:'指引案例 4 由教務處啟動評估並協調跨處室合作，討論班級教室移至一樓、無障礙動線與電梯卡、體育及其他課程的參與調整，以及大型活動的支持。由相關單位執行，教務處彙整並追蹤，隨復健進度調整。主責業務的討論應視具體調整內容與各校分工而定。'},
 {id:'dede',title:'案例二｜德德如何參與體育與校外活動？',subtitle:'罕見疾病與體能限制',page:'參考指引案例 2（印刷頁 11–12）',story:'德德進入國小後，因動作協調及平衡困難，影響體育課與體育表演會的參與。三年級時在導師建議下接受醫療評估，發現罹患罕見疾病「粒線體缺陷」，細胞較難產生足夠能量，需持續回診與接受照護。家長希望學校對課程學習、校外教學和體育表演會等需要較多體力的活動提供合理調整，使德德能安全參與。',guide:'指引案例 2 由教務處作為受理窗口，協調體育課、美勞活動、校外活動的參與方式，並與總務處討論防滑、扶手及教室位置等環境調整。學校統整措施、書面通知家長並每學期追蹤檢討。主責業務依調整措施所涉權責與各校組織分工協調。'},
 {id:'xiaoyun',title:'案例三｜小紜返校後如何兼顧健康與學習？',subtitle:'重大傷病與學習參與',page:'參考指引案例 5（印刷頁 14–15）',story:'小紜因疲勞、發燒及瘀青等症狀就醫，經診斷為白血病。住院治療後狀況較穩定，已可返校，但仍須定期治療和追蹤。因免疫功能低下，飲食、環境衛生與體能負荷都需要留意。家長向學校提出合理調整申請，希望提供安全友善的學習環境及必要課業支持，以減少感染風險，維護健康與學習權益。',guide:'指引案例 5 由學務處受理，協調教務處、總務處、導師等討論餐食、教室清潔消毒、缺課期間的線上學習及低強度體育活動；由學務處統整執行並每學期檢討，必要時滾動調整。主責業務可依學校分工及具體需求討論。'}
];
const LEAD_UNITS=['學務處','教務處','輔導室','總務處','其他'];
const PRINCIPLES=[
 {id:'purpose',title:'目的性',prompt:'所提調整是否有助於參與學校教育活動，且不改變課程或學習任務的核心目的？'},
 {id:'relevance',title:'相關性',prompt:'所提調整是否與學生的障礙處境及參與困難相關，並有助於減少或排除阻礙？'},
 {id:'feasibility',title:'可行性',prompt:'在法律及學校實務上，這項措施是否可執行？還需要哪些單位或資源支持？'},
 {id:'proportionality',title:'比例性（不成比例或過度負擔）',prompt:'衡量所需人力、經費、時間與可得支持資源後，是否未構成不成比例或過度負擔？'}
];
const JUDGMENTS=['符合','尚待釐清','不符合'];
const $=id=>document.getElementById(id);
const STATE={code:'',profile:null,mine:null,section:1,mode:'form',stage:'1',caseId:'azhe',introTopic:'',introContent:'',processDrafts:{},caseDrafts:{},filter:'全部',results:{},loading:false,resultBusy:false,timer:null,toastTimer:null};
function E(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n}
function append(parent,...children){children.forEach(ch=>parent.append(ch));return parent}
function paragraph(text,cls){return E('p',cls||'',text)}
function button(text,fn,cls){const b=E('button',cls||'action',text);b.type='button';b.addEventListener('click',fn);return b}
function labelText(t,small=''){const n=E('label','field-label',t);if(small)n.append(E('small','',` ${small}`));return n}
function field(value,placeholder,limit,onInput){const t=E('textarea','textbox');t.value=value||'';t.placeholder=placeholder;t.maxLength=limit;t.addEventListener('input',()=>onInput(t.value));return t}
let fieldIdCounter=0;
function labeledField(root,title,small,value,placeholder,limit,onInput){
 const lab=labelText(title,small),t=field(value,placeholder,limit,onInput);t.id='raField_'+(++fieldIdCounter);lab.htmlFor=t.id;root.append(lab,t);return t;
}
function note(text){return paragraph(text,'note')}
function actions(...items){return append(E('div','actions'),...items)}
function showToast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(STATE.toastTimer);STATE.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4000)}
function isConfigured(){return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL)}
let requestNo=0;
function api(params){return new Promise((resolve,reject)=>{
  if(!isConfigured())return reject(new Error('請先設定 Apps Script 網址。'));
  const cb='ra_cb_'+Date.now()+'_'+(++requestNo);const s=document.createElement('script');let done=false;
  const timer=setTimeout(()=>finish(new Error('連線逾時，請檢查 Apps Script 部署設定。')),18000);
  function finish(err,data){if(done)return;done=true;clearTimeout(timer);delete window[cb];s.remove();err?reject(err):resolve(data)}
  window[cb]=data=>{if(data&&data.ok)finish(null,data);else finish(new Error(data&&data.error||'後台處理失敗'))};
  s.onerror=()=>finish(new Error('連線失敗，請檢查網址及部署權限。'));
  s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb,nonce:Date.now()}).toString();document.head.append(s);
})}
// 文字內容透過 POST 傳送；等待 Apps Script 寫入回條，成功後才對參與者顯示已儲存。
async function apiWrite(params){
  if(!isConfigured())throw new Error('請先設定 Apps Script 網址。');
  const receiptId=(crypto.randomUUID?crypto.randomUUID().replace(/-/g,''):(Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)));
  const body=JSON.stringify({...params,receiptId});
  try{await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body,redirect:'follow'})}

function renderIntroResults(root,res){
 const stats=E('div','stats');const total=E('div','stat');append(total,E('small','', '已填答人數'),E('strong','',res.total||0));const top=E('div','stat');const counts=res.counts||[0,0,0,0];const mx=Math.max(...counts);append(top,E('small','', '最多人選擇'),E('strong','',res.total?('合理調整的'+TOPICS[counts.indexOf(mx)]):'尚無回應'));append(stats,total,top);root.append(stats);
 TOPICS.forEach((t,i)=>{const line=E('div','barrow');const head=E('div','barhead');append(head,E('span','',`合理調整的${t}`),E('span','',`${counts[i]||0} 人（${res.total?Math.round(counts[i]/res.total*100):0}%）`));const track=E('div','track');const fill=E('div','fill');fill.style.background=COLORS[i];fill.style.width=(res.total?counts[i]/res.total*100:0)+'%';track.append(fill);append(line,head,track);root.append(line)});
 const filters=E('div','pillrow');['全部',...TOPICS].forEach(t=>{const b=button(t==='全部'?'全部回應':'合理調整的'+t,()=>{STATE.filter=t;renderResultContent(root,1)},'pill'+(STATE.filter===t?' active':''));filters.append(b)});root.append(filters);
 const rows=(res.rows||[]).filter(r=>STATE.filter==='全部'||r.topic===STATE.filter);root.append(note(`顯示 ${rows.length} 筆回答。內容可供全體共同討論。`));if(!rows.length)root.append(E('div','empty','目前尚無回應。'));
 rows.forEach(r=>{const card=publicCard(r.name,r.at,'合理調整的'+r.topic);card.append(E('div','answer-text',r.content));root.append(card)})
}
function renderProcessResults(root,res){
 const filters=E('div','pillrow');STAGES.forEach(s=>{filters.append(button('階段 '+s.id+'｜'+s.title,()=>{STATE.stage=s.id;renderResultContent(root,2)},'pill'+(STATE.stage===s.id?' active':'')))});root.append(filters);
 const rows=(res.rows||[]).filter(r=>r.stage===STATE.stage);root.append(note('第 '+STATE.stage+' 階段，共 '+rows.length+' 筆回應。'));
 if(!rows.length)root.append(E('div','empty','這個階段尚無人提交。'));
 rows.forEach(r=>{const card=publicCard(r.name,r.at);const a=E('div','subanswer');append(a,E('div','label','學校可能發生的問題'),E('div','answer-text',r.problem));const b=E('div','subanswer');append(b,E('div','label','需要的資源'),E('div','answer-text',r.resources));append(card,a,b);root.append(card)})
}
function renderCaseResults(root,res){
 const filters=E('div','pillrow');CASES.forEach(c=>filters.append(button(c.title.split('｜')[0],()=>{STATE.caseId=c.id;renderResultContent(root,3)},'pill'+(STATE.caseId===c.id?' active':''))));root.append(filters);
 const c=CASES.find(c=>c.id===STATE.caseId);root.append(paragraph(c.title,'hint'));
 const rows=(res.rows||[]).filter(r=>r.caseId===STATE.caseId);root.append(note('這個案例共有 '+rows.length+' 筆回答。'));
 if(rows.length){
   const unitCounts=new Map();rows.forEach(r=>{const u=r.leadUnit==='其他'?(r.leadOther||'其他'):r.leadUnit;if(u)unitCounts.set(u,(unitCounts.get(u)||0)+1)});
   const stats=E('div','unit-summary');stats.append(E('h4','', '大家選擇的主責單位'));
   const counts=[...unitCounts.entries()].sort((a,b)=>b[1]-a[1]);counts.forEach(([u,n])=>stats.append(E('span','unit-pill',u+' '+n+' 人')));root.append(stats);
 }else root.append(E('div','empty','目前尚無案例判斷。'));
 rows.forEach(r=>{
   const card=publicCard(r.name,r.at);
   const lead=E('div','subanswer');append(lead,E('div','label','主責業務單位'),E('div','answer-text',r.leadUnit==='其他'?'其他：'+(r.leadOther||'未填寫'):r.leadUnit||'未選擇'));
   const measures=E('div','subanswer');append(measures,E('div','label','建議討論的具體調整措施'),E('div','answer-text',r.measures));append(card,lead,measures);
   PRINCIPLES.forEach(p=>{
     const sub=E('div','subanswer');const hd=E('div','principle-result-head');append(hd,E('span','label',p.title),E('span','judgment',r[p.id+'Choice']||'未填寫'));
     append(sub,hd,E('div','answer-text',r[p.id+'Note']||'未填寫'));card.append(sub)
   });
   const dispute=E('div','subanswer');append(dispute,E('div','label','爭議處理'),E('div','answer-text',r.dispute));card.append(dispute);root.append(card)
 });
 const det=E('details','reference');append(det,E('summary','', '展開：參考指引的處理方式'),paragraph(c.guide),note(c.page));root.append(det)
}
function renderQAResults(root,res){
 const qs=res.questions||[],replies=res.replies||[];root.append(note('目前有 '+qs.length+' 個公開問題、'+replies.length+' 則公開回覆。'));
 if(!qs.length){root.append(E('div','empty','目前還沒有人提問。'));return}
 qs.forEach((q,i)=>{
 const thread=E('article','qthread');const head=E('div','answer-head');append(head,E('div','author',`${i+1}. ${q.name}`),E('span','time',formatTime(q.at)));thread.append(head,E('div','qcontent',q.content));
 const owned=!!STATE.mine&&(STATE.mine.questions||[]).includes(q.questionId);
 if(owned)thread.append(button('撤回我的問題',()=>withdraw('withdrawQuestion',{questionId:q.questionId}),'danger-link'));
 const under=replies.filter(r=>r.questionId===q.questionId);
 under.forEach(r=>{const card=E('div','reply');const header=E('div','answer-head');append(header,E('span','author',r.name),E('span','time',formatTime(r.at)));append(card,header,E('div','answer-text',r.content));
 if(STATE.mine&&(STATE.mine.replies||[]).includes(r.replyId))card.append(button('撤回回覆',()=>withdraw('withdrawReply',{replyId:r.replyId}),'danger-link'));
 thread.append(card)});
 if(STATE.code){const replyBox=E('div','replybox');const replyText=field('','我會如何回應這個問題……',600,()=>{});replyText.setAttribute('aria-label','回覆問題 '+(i+1));const status=E('p','status');const post=button('送出回覆',()=>write('reply',{questionId:q.questionId,content:replyText.value.trim()},post,status,()=>{replyText.value='';loadResults()}),'action secondary small');append(replyBox,replyText,actions(post),status);thread.append(replyBox)}
 root.append(thread)
 })
}
async function withdraw(action,p){if(!confirm('確定要撤回此內容嗎？撤回後將不再公開顯示。'))return;try{await apiWrite({action,code:STATE.code,...p});showToast('已撤回內容');await refreshMine();await loadResults()}catch(e){showToast(e.message)}}
function startPolling(){clearInterval(STATE.timer);STATE.timer=setInterval(()=>{if(!document.hidden&&(STATE.mode==='results'||STATE.section===4))loadResults()},20000)}
$('showCode').onclick=()=>showCodeDialog(false);
$('switchUser').onclick=()=>{if(!confirm('切換參與者會清除本裝置自動登入。請先保存返回代碼，以便日後恢復。'))return;storageClear();STATE.code='';STATE.profile=null;STATE.mine=null;STATE.mode='form';location.hash='s1';renderWelcome()};
window.addEventListener('hashchange',navFromHash);
(async()=>{startPolling();const remembered=storageGet();if(remembered){try{await enterWithCode(remembered)}catch(_){storageClear();STATE.code='';STATE.profile=null;renderWelcome()}}else renderWelcome()})();
</script>
</body>
</html>
